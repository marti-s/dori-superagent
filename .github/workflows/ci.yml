name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: skills/dori-mode/scripts
      - run: bun run ci

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: skills/dori-mode/scripts
      - run: bun run test
      - run: bun run test:skill

  e2e-hc:
    runs-on: ubuntu-latest
    env:
      HC_SESSION: dori-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Install hc 0.1.20
        run: |
          curl -fsSL https://releases.herdr.dev/core/install.sh | HC_VERSION=0.1.20 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hc update --version 0.1.20
      - run: hc --version
      - name: hc e2e (skipped only while the test file does not exist)
        run: |
          if [ -f test/e2e-hc.test.ts ]; then
            bun test test/e2e-hc.test.ts
          else
            echo 'SKIP e2e-hc until the test lands'
          fi
